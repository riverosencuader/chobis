<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Asados Chobis</title>
<meta name="theme-color" content="#b4441c">
<meta name="description" content="Cargar asados, cuentas e historial de los Chobis.">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Asados">
<style>
  html,body{margin:0;height:100%;background:#faf6f0;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
  iframe{position:fixed;inset:0;width:100%;height:100%;border:0;background:#faf6f0}
  .aviso{display:none;position:fixed;inset:0;align-items:center;justify-content:center;flex-direction:column;gap:14px;padding:24px;text-align:center;color:#2b2118}
  .aviso a{display:inline-block;padding:14px 22px;border-radius:10px;background:#b4441c;color:#fff;font-weight:600;text-decoration:none}
  .aviso p{margin:0;max-width:340px;line-height:1.5;color:#6b5d50}
</style>
</head>
<body>
<iframe id="app" title="Asados Chobis" allow="web-share; clipboard-write; fullscreen" referrerpolicy="no-referrer-when-downgrade"></iframe>
<div class="aviso" id="aviso">
  <img src="icon-192.png" width="72" height="72" alt="">
  <p id="avisoTxt">No se pudo abrir la app.</p>
  <a id="abrir" href="#" target="_blank" rel="noopener">Abrir en el navegador</a>
</div>
<script src="../config.js"></script>
<script>
  const url = (window.APPS || {})['asados'] || '';
  const ok = /^https:\/\/script\.google\.com\/.+\/exec/.test(url);
  if (ok) {
    document.getElementById('app').src = url;
    document.getElementById('abrir').href = url;
  } else {
    document.getElementById('app').style.display = 'none';
    document.getElementById('avisoTxt').textContent = 'Falta pegar el link de esta app en config.js.';
    document.getElementById('abrir').style.display = 'none';
    document.getElementById('aviso').style.display = 'flex';
  }
  if ('serviceWorker' in navigator) navigator.serviceWorker.register('../sw.js', { scope: '../' }).catch(()=>{});
</script>
</body>
</html>
