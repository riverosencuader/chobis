<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Apps Chobis</title>
<meta name="theme-color" content="#b4441c">
<link rel="icon" href="asados/icon-192.png">
<style>
  body{margin:0;background:#faf6f0;color:#2b2118;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
  main{max-width:480px;margin:0 auto;padding:32px 16px}
  h1{font-size:24px;margin:0 0 6px}
  p{color:#6b5d50;line-height:1.5;margin:0 0 22px}
  a.app{display:flex;align-items:center;gap:14px;padding:14px;margin-bottom:12px;border-radius:14px;background:#fff;border:1px solid #eadfd2;color:inherit;text-decoration:none}
  a.app img{width:52px;height:52px;border-radius:12px}
  a.app b{display:block;font-size:17px}
  a.app span{font-size:14px;color:#6b5d50}
</style>
</head>
<body>
<main>
  <h1>Apps Chobis</h1>
  <p>Abrí la app que quieras y, en Chrome, tocá ⋮ → <b>Instalar app</b> para tenerla en el celular.</p>
  <a class="app" href="historial/"><img src="historial/icon-192.png" alt=""><div><b>Historial Chobis</b><span>Asados, resúmenes y cuentas</span></div></a>
  <a class="app" href="calculadora/"><img src="calculadora/icon-192.png" alt=""><div><b>Calculadora gastos</b><span>Dividir gastos y compartir las cuentas</span></div></a>
</main>
</body>
</html>
